name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Run tests
        run: ./gradlew test

      - name: Validate verification tooling
        run: python3 -m unittest discover -s tools/tests

      - name: Verify plugin compatibility
        timeout-minutes: 10
        run: ./gradlew verifyPlugin

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/test/
          retention-days: 7

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: KGBoard-plugin
          path: build/distributions/*.zip
          retention-days: 14

  native-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
      - name: Install isolated X11 test dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb openbox
      - name: Run pinned IDEA settings matrix and SDK workflow
        run: tools/run-ui-tests.sh integrationTest --tests '*Settings*UiTest' -PplatformVersion=263.7307.200 --console=plain
      - name: Upload actual UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ui-evidence
          path: |
            build/reports/kgboard-ui/
            build/reports/tests/integrationTest/
            out/ide-tests/tests/**/log/
          retention-days: 14
